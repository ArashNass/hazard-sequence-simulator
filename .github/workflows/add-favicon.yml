name: Add favicon
on:
  push:
    paths:
      - .github/workflows/add-favicon.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'rel="icon"' in s or "rel='icon'" in s:
              raise SystemExit(0)
          icon='  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20rx%3D%275%27%20fill%3D%27%230f2350%27%2F%3E%3Cpath%20d%3D%27M2%2010h3l2-6%204%2012%202-6%202%203h3M7%2019l1-2.5M11%2019.5l1-2.5M15%2019l1-2.5%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%271.9%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3C%2Fsvg%3E" />\n'
          marker='  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n'
          if marker not in s:
              raise SystemExit('viewport marker not found')
          s=s.replace(marker,marker+icon,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add hazard sequence favicon"
          git push
